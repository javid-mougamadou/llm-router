# Jekyll configuration - Cayman theme for LLM Router docs
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-seo-tag

title: LLM Router
description: Lightweight FastAPI proxy that routes Anthropic and OpenAI API requests to AWS Bedrock
show_downloads: true

keywords:
  - LLM Router
  - LLM Proxy
  - AWS Bedrock
  - Anthropic API
  - OpenAI API
  - FastAPI
  - Budget management
  - API key authentication

# Sitemap: exclude internal docs
defaults:
  -
    scope:
      path: "GITHUB_PAGES_SETUP.md"
    values:
      sitemap: false

author: Javid Mougamadou
url: https://llm-router.javid-space.cloud
baseurl: ""
